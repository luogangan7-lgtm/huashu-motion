<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Washing · continuous photographic texture</title>
<!-- Owns a single continuous photographic UV mesh; no atlas cuts, replacement skin or camera motion.
Depends on native WebGL, local GSAP/OM and the hash-pinned complete anchor. Called by focused wash CI.
Invariants: positive mesh area, fixed plate rim/kitchen; short sponge motion within the plate. -->
<style>*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#243943}#film{position:relative;width:1920px;height:1080px;overflow:hidden}canvas{position:absolute;inset:0;width:1920px;height:1080px}</style>
<script src="vendor/gsap.min.js"></script><script src="vendor/om.js"></script></head>
<body><div id="film" data-composition-id="film" data-width="1920" data-height="1080" data-fps="30" data-duration="3"><canvas id="photo" width="1920" height="1080" aria-label="AI photographic mother washing a plate with a yellow sponge"></canvas></div>
<script>
const W=1672,H=941,NX=209,NY=118,canvas=document.querySelector('#photo');
const gl=canvas.getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:true});
if(!gl)throw new Error('Native WebGL unavailable');
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 p;attribute vec2 uv;varying vec2 tex;void main(){tex=uv;gl_Position=vec4(p.x/836.0-1.0,1.0-p.y/470.5,0.0,1.0);}'));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision highp float;varying vec2 tex;uniform sampler2D photo;void main(){gl_FragColor=vec4(texture2D(photo,tex).rgb,1.0);}'));
gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const base=[],indices=[];
for(let y=0;y<=NY;y++)for(let x=0;x<=NX;x++)base.push(x*W/NX,y*H/NY);
for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){const i=y*(NX+1)+x;indices.push(i,i+1,i+NX+1,i+1,i+NX+2,i+NX+1)}
const positions=new Float32Array(base),uv=new Float32Array(base.map((v,i)=>v/(i%2?H:W)));
function attribute(name,data,usage){const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,data,usage);const at=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(at);gl.vertexAttribPointer(at,2,gl.FLOAT,false,0,0);return buffer}
const positionBuffer=attribute('p',positions,gl.DYNAMIC_DRAW);attribute('uv',uv,gl.STATIC_DRAW);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(indices),gl.STATIC_DRAW);
const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
const photo=new Image();let ready=false,lastTime=0;
// Ellipse has a rigid central patch and a C1 taper: no discontinuity at its boundary.
function patch(x,y,cx,cy,rx,ry){const q=Math.hypot((x-cx)/rx,(y-cy)/ry),u=Math.max(0,Math.min(1,(q-.45)/.55));return 1-u*u*(3-2*u)}
function field(x,y,t){
 const u=Math.max(0,Math.min(1,(t-.15)/2.7)),phase=4*Math.PI*u;
 const hand=Math.max(patch(x,y,305,636,67,48),patch(x,y,285,673,72,46),.72*patch(x,y,378,601,68,33));
 const dx=8*Math.sin(phase),dy=2*Math.sin(2*phase);
 const head=patch(x,y,502,211,164,181),nod=.0015*Math.sin(2*Math.PI*t/3);
 const breath=patch(x,y,585,456,118,130)*.65*Math.sin(2*Math.PI*t/3);
 return{x:x+hand*dx-head*(y-330)*nod,y:y+hand*dy+head*(x-555)*nod+breath};
}
function draw(t){
 lastTime=t;if(!ready)return;
 for(let i=0;i<base.length;i+=2){const p=field(base[i],base[i+1],t);positions[i]=p.x;positions[i+1]=p.y}
 gl.bindBuffer(gl.ARRAY_BUFFER,positionBuffer);gl.bufferSubData(gl.ARRAY_BUFFER,0,positions);
 gl.viewport(0,0,1920,1080);gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_SHORT,0);gl.finish();
}
// Diagnostic reads inspect the same mesh vertices uploaded to WebGL; tests also sample actual pixels.
window.washMesh={draw,snapshot(){let min=Infinity,max=0;for(let i=0;i<indices.length;i+=3){const[a,b,c]=indices.slice(i,i+3).map(v=>v*2);const area=(positions[b]-positions[a])*(positions[c+1]-positions[a+1])-(positions[b+1]-positions[a+1])*(positions[c]-positions[a]);const ratio=area/(W/NX*H/NY);min=Math.min(min,ratio);max=Math.max(max,ratio)}return{ready,t:lastTime,minAreaRatio:min,maxAreaRatio:max,sponge:field(285,673,lastTime),vertices:positions.length/2}},readPixels(){const a=new Uint8Array(1920*1080*4);gl.readPixels(0,0,1920,1080,gl.RGBA,gl.UNSIGNED_BYTE,a);return{opaque:a.every((v,i)=>i%4!==3||v===255),error:gl.getError()}}};
const clock={t:0},tl=gsap.timeline({paused:true});tl.addLabel('scene:continuous-washing',0).to(clock,{t:3,duration:3,ease:'none',onUpdate:()=>draw(clock.t)},0);window.__timelines.film=tl;
OM.ready(new Promise((resolve,reject)=>{photo.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,texture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,photo);ready=true;draw(clock.t);resolve()};photo.onerror=()=>reject(new Error('Complete anchor failed to load'));photo.src='assets/anchor.png'}));
</script></body></html>
