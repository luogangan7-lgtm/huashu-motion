# DAERDO public-asset film; rendering and verification run only on the hosted runner.
name: DAERDO website film
on:
  push:
    branches: [feat/daerdo-site-film]
  pull_request:
    paths: ['examples/daerdo-site-film/**', 'test/daerdo-film.test.js', '.github/workflows/daerdo-film.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daerdo-film-${{ github.ref }}
  cancel-in-progress: false
jobs:
  film:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OM_SAMPLES: 'off'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Hosted tools and exact source
        run: |
          set -euo pipefail
          mkdir -p evidence/stills evidence/frames "$RUNNER_TEMP/isolated-home" "$RUNNER_TEMP/om-home"
          echo "HOME=$RUNNER_TEMP/isolated-home" >> "$GITHUB_ENV"
          echo "OM_HOME=$RUNNER_TEMP/om-home" >> "$GITHUB_ENV"
          echo "OM_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          git rev-parse HEAD | tee evidence/source-sha.txt
          git rev-parse HEAD^{tree} | tee evidence/source-tree.txt
          { node --version; google-chrome --version; ffmpeg -version | head -1; } | tee evidence/tools.txt
      - name: Fetch pinned official assets
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,pathlib,json,struct
          root=pathlib.Path('examples/daerdo-site-film/assets');root.mkdir(parents=True,exist_ok=True)
          assets=[
          ('g25bt.png','https://daerdo.com/daerdo/hero/product-cutouts/G25BT-cutout-v1.png','97405eea227c53d18985fbda33016cf8fe0697066d6e7657f86a6ae90378aecb'),
          ('wordmark.png','https://daerdo.com/daerdo/brand/daerdo-wordmark.png?v=20260720','23acee9602bd931d89624969f9e038d9ce0160f8b3320928d335c74762916de9'),
          ('inter.woff2','https://daerdo.com/_next/static/media/83afe278b6a6bb3c-s.2bn3s6zvc0dyp.woff2',None)]
          receipts=[]
          for name,url,expected in assets:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  data=response.read();mime=response.headers.get('Content-Type')
              sha=hashlib.sha256(data).hexdigest()
              if expected:assert sha==expected,(name,sha)
              (root/name).write_bytes(data)
              item={'name':name,'url':url,'sha256':sha,'bytes':len(data),'contentType':mime}
              if name.endswith('.png'):
                  assert data[:8]==b'\x89PNG\r\n\x1a\n'
                  w,h,depth,color=struct.unpack('>IIBB',data[16:26]);assert color==6 and depth==8
                  item.update(width=w,height=h,colorType=color,alpha=True)
              receipts.append(item)
          pathlib.Path('evidence/assets.json').write_text(json.dumps(receipts,indent=2))
          print(json.dumps(receipts))
          PY
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {decodePng} from './cli/lib/check.js';
          const receipts=[];
          for(const name of ['g25bt.png','wordmark.png']){
            const p=decodePng(readFileSync('examples/daerdo-site-film/assets/'+name));let x0=p.width,y0=p.height,x1=-1,y1=-1,transparent=0;
            for(let y=0;y<p.height;y++)for(let x=0;x<p.width;x++){const a=p.px[(y*p.width+x)*4+3];if(a===0)transparent++;if(a>16){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}}
            if(x1<0)throw Error('Official PNG has no visible pixels');
            // Record alpha bounds; a white/opaque official source is valid and remains unchanged.
            receipts.push({name,width:p.width,height:p.height,alphaBounds:[x0,y0,x1,y1],transparentPixels:transparent});
          }
          writeFileSync('evidence/asset-alpha.json',JSON.stringify(receipts,null,2));console.log(receipts);
          JS
      - name: Hardest hero and four actual keyframes before render
        run: |
          set -euo pipefail
          node cli/om.js still examples/daerdo-site-film --at 0.75,3.75,6.75,10 --out evidence/stills
      - name: Upload first visual draft
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daerdo-keyframes-${{ github.sha }}
          path: |
            evidence/stills/
            evidence/assets.json
            evidence/asset-alpha.json
            examples/daerdo-site-film/treatment.md
          retention-days: 7
      - name: Actual visual defect RED controls then GREEN
        run: |
          set -euo pipefail
          for defect in missing-image overflow contrast loop; do
            if DAERDO_FILM_MUTATION="$defect" node --test --test-reporter=tap test/daerdo-film.test.js > "evidence/red-$defect.tap" 2>&1; then echo "Defect unexpectedly passed: $defect"; exit 1; fi
            grep -q 'not ok .*Daerdo film' "evidence/red-$defect.tap"
            grep -q '^# fail 1$' "evidence/red-$defect.tap"
            grep -q '^# skipped 0$' "evidence/red-$defect.tap"
            case "$defect" in
              missing-image) grep -q 'device image ready' "evidence/red-$defect.tap";;
              overflow) grep -q 'image full bounds' "evidence/red-$defect.tap";;
              contrast) grep -q 'text contrast' "evidence/red-$defect.tap";;
              loop) grep -q 'loop endpoint pixels' "evidence/red-$defect.tap";;
            esac
            echo "RED actual DOM defect: $defect" | tee -a evidence/acceptance.txt
          done
          timeout 15m node --test --test-concurrency=1 --test-reporter=tap test/package.test.js test/project.test.js test/browser.test.js test/render.test.js test/check.test.js test/voice-demo.test.js test/daerdo-film.test.js 2>&1 | tee evidence/tests.tap
          if grep -Eq '^# (skipped|fail) [1-9]' evidence/tests.tap; then exit 1; fi
      - name: Scan and render real film
        run: |
          set -euo pipefail
          node cli/om.js check examples/daerdo-site-film --json > evidence/check.json
          jq -e 'length == 0' evidence/check.json
          node cli/om.js sound examples/daerdo-site-film 2>&1 | tee evidence/sound.txt
          timeout 8m node cli/om.js render examples/daerdo-site-film --workers 2 --verbose 2>&1 | tee evidence/render.txt
          node cli/om.js qa examples/daerdo-site-film --loop --json > evidence/qa.json
          jq -e '.loop.checked == true and .loop.seamless == true' evidence/qa.json
      - name: Actual encode, loop, decode and sound receipts
        run: |
          set -euo pipefail
          film=$(find examples/daerdo-site-film/out -name '*.mp4' | head -1)
          cp "$film" evidence/daerdo-site-film.mp4
          ffprobe -v error -count_frames -show_streams -show_format -of json "$film" > evidence/probe.json
          verify() { jq -e '([.streams[]|select(.codec_type=="video")][0]|.codec_name=="h264" and .width==1920 and .height==1080 and .pix_fmt=="yuv420p" and .nb_read_frames=="360") and any(.streams[];.codec_type=="audio") and ((.format.duration|tonumber)-12|fabs)<0.1' "$1" >/dev/null; }
          jq '(.streams[]|select(.codec_type=="video")|.width)=1919' evidence/probe.json > evidence/probe-mutant.json
          if verify evidence/probe-mutant.json; then exit 1; fi
          echo 'RED wrong encoded width' | tee -a evidence/acceptance.txt
          verify evidence/probe.json
          ffmpeg -v error -xerror -i "$film" -f null - 2> evidence/decode.log
          ffmpeg -v error -i "$film" -vf 'fps=1,scale=480:-1,tile=4x3' -frames:v 1 evidence/contact-sheet.png
          for at in 0 0.75 2.75 3 3.75 5.75 6 6.75 8.75 9 10 11.5; do ffmpeg -v error -ss "$at" -i "$film" -frames:v 1 "evidence/frames/at-$at.png"; done
          ffmpeg -v error -i "$film" -lavfi 'showspectrumpic=s=1600x400:legend=0:scale=log:fscale=log' -frames:v 1 evidence/sound-spectrum.png
          ffmpeg -hide_banner -i "$film" -af volumedetect -f null - 2> evidence/loudness.txt
          ffmpeg -hide_banner -i "$film" -af ebur128=peak=true -f null - 2> evidence/lufs.txt
          sha256sum evidence/daerdo-site-film.mp4 examples/daerdo-site-film/index.html evidence/probe.json > evidence/SHA256SUMS
          echo 'GREEN real visual gate, exact loop endpoints, encoded loop, 360 frames and complete decode' | tee -a evidence/acceptance.txt
      - name: Upload film and original evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daerdo-film-${{ github.sha }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
