# Focused source-asset acceptance. All executable QA runs on GitHub; no composition or renderer changes.
name: DAERDO MiniMax source asset QA
on:
  pull_request:
    paths: ['examples/daerdo-minimax-story30/**', '.github/workflows/daerdo-minimax-asset-qa.yml']
permissions:
  contents: read
concurrency:
  group: daerdo-minimax-asset-${{ github.ref }}
  cancel-in-progress: false
jobs:
  asset:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source and hosted tools
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version > evidence/tools.txt
      - name: Actual input frames, probe and complete decode
        run: |
          python3 examples/daerdo-minimax-story30/asset-qa.py inspect --file examples/daerdo-minimax-story30/assets/wash.mp4 --manifest examples/daerdo-minimax-story30/assets/wash-source.json --out evidence
      - name: Upload actual first asset frames
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daerdo-minimax-wash-frames-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          retention-days: 7
      - name: Genuine frozen video RED then original video GREEN
        run: |
          set -euo pipefail
          python3 examples/daerdo-minimax-story30/asset-qa.py freeze --file examples/daerdo-minimax-story30/assets/wash.mp4 --out evidence/frozen-wash.mp4
          if python3 examples/daerdo-minimax-story30/asset-qa.py motion --file evidence/frozen-wash.mp4 --out evidence/frozen-motion.json > evidence/red-freeze.log 2>&1; then
            echo 'Frozen real video unexpectedly passed'; exit 1
          fi
          grep -q '^ASSET_QA_FAIL: actual hand and sponge pixel motion$' evidence/red-freeze.log
          echo 'RED actual frozen MP4 hand/sponge pixels' >> evidence/acceptance.txt
          python3 examples/daerdo-minimax-story30/asset-qa.py motion --file examples/daerdo-minimax-story30/assets/wash.mp4 --out evidence/motion.json > evidence/green-motion.log 2>&1
          echo 'GREEN original MP4 hand/sponge pixels. Independent appearance review pending.' >> evidence/acceptance.txt
      - name: Upload raw asset evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daerdo-minimax-wash-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
