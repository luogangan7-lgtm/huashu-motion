# Focused source-asset acceptance. All executable QA runs on GitHub; no composition or renderer changes.
name: DAERDO MiniMax source asset QA
on:
  pull_request:
    paths: ['examples/daerdo-minimax-story30/**', '.github/workflows/daerdo-minimax-asset-qa.yml']
permissions:
  contents: read
concurrency:
  group: daerdo-minimax-asset-${{ github.ref }}
  cancel-in-progress: false
jobs:
  asset:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source and hosted tools
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version > evidence/tools.txt
      - name: Actual input frames, probe and complete decode
        run: |
          python3 examples/daerdo-minimax-story30/asset-qa.py inspect --file examples/daerdo-minimax-story30/assets/wash.mp4 --manifest examples/daerdo-minimax-story30/assets/wash-source.json --out evidence
          for clip in gift response; do
            python3 examples/daerdo-minimax-story30/asset-qa.py inspect --file "examples/daerdo-minimax-story30/assets/$clip.mp4" --manifest "examples/daerdo-minimax-story30/assets/$clip-source.json" --out "evidence/$clip"
          done
      - name: Upload actual first asset frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daerdo-minimax-source-frames-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          retention-days: 7
      - name: Wrong manifest duration and frame count RED then exact metadata GREEN
        run: |
          set -euo pipefail
          for key in source_duration source_frames; do
            python3 -c 'import json,sys; p="examples/daerdo-minimax-story30/assets/wash-source.json"; d=json.load(open(p)); d[sys.argv[1]]+=1; json.dump(d,open("evidence/wrong-"+sys.argv[1]+".json","w"))' "$key"
            if python3 examples/daerdo-minimax-story30/asset-qa.py metadata --file evidence/probe.json --manifest "evidence/wrong-$key.json" --out evidence > "evidence/red-$key.log" 2>&1; then
              echo "Wrong real manifest $key unexpectedly passed"; exit 1
            fi
            case "$key" in
              source_duration) grep -q '^ASSET_QA_FAIL: exact genuine source duration$' "evidence/red-$key.log";;
              source_frames) grep -q '^ASSET_QA_FAIL: exact genuine decoded source frames$' "evidence/red-$key.log";;
            esac
            echo "RED actual manifest $key mismatch" >> evidence/acceptance.txt
          done
          python3 examples/daerdo-minimax-story30/asset-qa.py metadata --file evidence/probe.json --manifest examples/daerdo-minimax-story30/assets/wash-source.json --out evidence > evidence/green-metadata.log 2>&1
      - name: Genuine frozen video RED then original video GREEN
        run: |
          set -euo pipefail
          for clip in wash gift response; do
            python3 examples/daerdo-minimax-story30/asset-qa.py freeze --file "examples/daerdo-minimax-story30/assets/$clip.mp4" --out "evidence/frozen-$clip.mp4"
            if python3 examples/daerdo-minimax-story30/asset-qa.py motion --role "$clip" --file "evidence/frozen-$clip.mp4" --out "evidence/frozen-$clip-motion.json" > "evidence/red-freeze-$clip.log" 2>&1; then
              echo "Frozen real $clip video unexpectedly passed"; exit 1
            fi
            case "$clip" in
              wash) grep -q '^ASSET_QA_FAIL: actual hand and sponge pixel motion$' "evidence/red-freeze-$clip.log";;
              *) grep -q "^ASSET_QA_FAIL: actual $clip subject pixel motion$" "evidence/red-freeze-$clip.log";;
            esac
            echo "RED actual frozen $clip MP4 subject pixels" >> evidence/acceptance.txt
            python3 examples/daerdo-minimax-story30/asset-qa.py motion --role "$clip" --file "examples/daerdo-minimax-story30/assets/$clip.mp4" --out "evidence/$clip-motion.json" > "evidence/green-$clip-motion.log" 2>&1
          done
          echo 'GREEN three original video subject pixels. Independent full-film review pending.' >> evidence/acceptance.txt
      - name: Upload raw asset evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daerdo-minimax-source-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
